<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster & Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* same tokens as the main site — remove this block if you're pasting
       this section into a page that already defines them */
    --bg-0:#050a10;
    --bg-1:#0a131c;
    --panel:#0c1720;
    --outline:#26404d;
    --ice:#6fc3e8;
    --ice-bright:#cdf2ff;
    --text:#e7f4fb;
    --text-dim:#7f97a3;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; overflow:hidden; background:var(--bg-0); font-family:'Montserrat',sans-serif; color:var(--text); }

  body{
    background:
      radial-gradient(60% 45% at 18% 8%, rgba(111,195,232,0.10), transparent 60%),
      radial-gradient(50% 40% at 85% 92%, rgba(111,195,232,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
  }

  .page-wrap{ position:relative; width:100%; height:100%; }

  .section-label{
    font-size:0.68em;
    font-weight:700;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:0.7em;
    padding-left:0.1em;
  }

  /* ---- map (fullscreen) ---- */

  .map-wrap{ position:fixed; inset:0; }

  .map-panel{
    position:absolute;
    inset:0;
    background-color:var(--panel);
    overflow:hidden;
  }

  #worldMap{
    display:block;
    width:100%;
    height:100%;
    cursor:grab;
  }
  #worldMap:active{ cursor:grabbing; }

  .country-path{
    fill:var(--bg-1);
    stroke:var(--outline);
    stroke-width:0.6;
    vector-effect:non-scaling-stroke;
    transition:fill .15s ease, stroke .15s ease;
  }
  .country-path.has-members{ fill:rgba(111,195,232,0.08); }
  .country-path:hover{ fill:rgba(111,195,232,0.18); stroke:var(--ice-bright); }

  .member-dot{
    fill:var(--ice-bright);
    stroke:var(--bg-0);
    stroke-width:0.6;
    filter:drop-shadow(0 0 3px rgba(111,195,232,0.9));
    cursor:pointer;
  }

  .map-tooltip{
    position:absolute;
    left:0; top:0;
    z-index:15;
    pointer-events:none;
    padding:0.55em 0.75em;
    background-color:var(--panel);
    outline:1px solid var(--outline);
    border:1px solid #000;
    font-size:0.7em;
    line-height:1.5;
    color:var(--text);
    white-space:normal;
    max-width:230px;
    opacity:0;
    visibility:hidden;
    transform:translate(-50%,-100%) translateY(-8px);
    transition:opacity .15s ease, transform .15s ease, visibility 0s linear .15s;
  }
  .map-tooltip.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,-100%) translateY(-12px);
    transition:opacity .15s ease, transform .15s ease, visibility 0s linear 0s;
  }
  .map-tooltip b{ color:var(--ice-bright); }

  .tooltip-head{
    display:flex;
    align-items:center;
    gap:0.45em;
  }
  .tooltip-head + .tooltip-members{ margin-top:0.45em; }

  .tooltip-flag{
    width:20px;
    height:14px;
    flex-shrink:0;
    object-fit:cover;
    box-shadow:0 0 0 1px var(--outline);
  }
  .tooltip-flag-fallback{
    width:20px;
    height:14px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 1px var(--outline);
    background:var(--bg-1);
    color:var(--text-dim);
    font-size:0.6em;
    font-weight:700;
  }

  .tooltip-avatar{
    width:20px;
    height:20px;
    flex-shrink:0;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 0 0 1px var(--outline);
    background:var(--bg-1);
  }

  .tooltip-members{
    display:flex;
    flex-direction:column;
    gap:0.32em;
    max-height:190px;
    overflow-y:auto;
    padding-right:2px;
  }

  .tooltip-member{
    display:flex;
    align-items:center;
    gap:0.4em;
    white-space:nowrap;
  }
  .tooltip-member span{ white-space:nowrap; }
  .tooltip-member-rank{
    margin-left:auto;
    color:var(--text-dim);
    font-size:0.92em;
    padding-left:0.6em;
  }

  .map-hint{
    position:fixed;
    left:1.2em;
    bottom:1.2em;
    z-index:10;
    font-size:0.6em;
    letter-spacing:0.06em;
    color:var(--text-dim);
    padding:0.5em 0.7em;
    background-color:rgba(12,23,32,0.75);
    outline:1px solid var(--outline);
    border:1px solid #000;
    backdrop-filter:blur(6px);
  }

  /* ---- compact rank table (floating over map) ---- */

  .roster-wrap{
    position:fixed;
    top:1.2em;
    right:1.2em;
    z-index:20;
    width:280px;
    max-width:calc(100vw - 2.4em);
    max-height:calc(100vh - 2.4em);
    display:flex;
    flex-direction:column;
  }
  .roster-wrap .section-label{ flex-shrink:0; }

  .rank-table{
    background-color:rgba(12,23,32,0.8);
    outline:1px solid var(--outline);
    border:1px solid #000;
    backdrop-filter:blur(10px);
    overflow-y:auto;
  }

  .rank-row{
    display:flex;
    align-items:center;
    gap:0.55em;
    padding:0.32em 0.55em;
    border-bottom:1px solid rgba(111,195,232,0.08);
    transition:background-color .15s ease;
  }
  .rank-row:last-child{ border-bottom:none; }
  .rank-row:hover{ background:rgba(111,195,232,0.06); }

  @keyframes rowHighlight{
    0%{ background:rgba(111,195,232,0.35); }
    100%{ background:rgba(111,195,232,0); }
  }
  .rank-row.row-highlight{ animation:rowHighlight 1.4s ease-out; }

  .rank-avatar{
    width:26px;
    height:26px;
    flex-shrink:0;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 0 0 1px var(--outline);
    background:var(--bg-1);
  }

  .rank-flag{
    width:22px;
    height:15px;
    flex-shrink:0;
    object-fit:cover;
    box-shadow:0 0 0 1px var(--outline);
  }
  .rank-flag-fallback{
    width:22px;
    height:15px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 1px var(--outline);
    background:var(--bg-1);
    color:var(--text-dim);
    font-size:0.55em;
    font-weight:700;
  }

  .rank-id{
    display:flex;
    flex-direction:column;
    gap:1px;
    min-width:0;
    flex:1;
  }

  .rank-name{
    font-size:0.75em;
    font-weight:700;
    letter-spacing:0.01em;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .rank-tag{
    font-size:0.54em;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ice);
  }

  .rank-status{
    padding:0.9em 0.7em;
    font-size:0.72em;
    color:var(--text-dim);
  }

</style>
</head>
<body>
  <div class="page-wrap">

    <div class="map-wrap">
      <div class="map-panel">
        <svg id="worldMap" viewBox="0 0 960 520" preserveAspectRatio="xMidYMid slice"></svg>
        <div class="map-tooltip" id="mapTooltip"></div>
      </div>
      <p class="map-hint">Scroll / pinch to zoom &middot; drag to pan</p>
    </div>

    <div class="roster-wrap">
      <p class="section-label">Roster</p>
      <div class="rank-table" id="rankTable">
        <div class="rank-status" id="status">Loading members&hellip;</div>
      </div>
    </div>

  </div>

  function codeFor(countryName){
    return NAME_TO_CODE[(countryName || '').trim().toLowerCase()] || null;

    return alpha2 ? ALPHA2_TO_NUMERIC[alpha2] : null;

  /* ---- shared avatar / flag markup ---- */

      ? `<img class="${cls}" src="https://flagcdn.com/w40/${code}.png" srcset="https://flagcdn.com/w80/${code}.png 2x" alt="${label}" loading="lazy">`
      : `<div class="${cls}-fallback">?</div>`;
  }
  function avatarHTML(m, cls){
    if(m.avatar){
      return `<img class="${cls}" src="${m.avatar}" alt="${m.name}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackAvatarSrc(m)}';">`;
    }
    return `<img class="${cls}" src="${fallbackAvatarSrc(m)}" alt="${m.name}" loading="lazy">`;
  }
  function fallbackAvatarSrc(m){
    const seed = encodeURIComponent(`${m.name}-${m.country}`);
    return `https://api.dicebear.com/9.x/identicon/svg?seed=${seed}&backgroundColor=0c1720&backgroundType=solid`;
  }
  function rankTag(m){ return m.rank || ''; }

  /* ---- roster list ---- */
  function renderRows(members){
    tableEl.innerHTML = '';
    members
      .filter(m => m.name && m.country)
      .sort((a, b) => Number(a.rank) - Number(b.rank))
      .forEach(m => {
        const code = codeFor(m.country);

        const row = document.createElement('div');
        row.className = 'rank-row';
        row.dataset.id = m.__id;
        row.innerHTML = `
          ${avatarHTML(m, 'rank-avatar')}
          <div class="rank-id">
            <span class="rank-name">${m.name}</span>
            <span class="rank-tag">${rankTag(m)}</span>
          </div>
          ${flagHTML(code, m.country, 'rank-flag')}
        `;
        tableEl.appendChild(row);
      });
  }

  /* ---- clicking a dot scrolls to + highlights its roster row ---- */
  function highlightMember(id){
    const row = tableEl.querySelector(`.rank-row[data-id="${id}"]`);
    if(!row) return;
    row.scrollIntoView({ behavior:'smooth', block:'center' });
    row.classList.remove('row-highlight');
    // restart the animation even if the row was just highlighted
    void row.offsetWidth;
    row.classList.add('row-highlight');
  }

  /* ---- world map ---- */
  function showTooltip(event, html){
    tooltipEl.innerHTML = html;
    const panelRect = tooltipEl.parentElement.getBoundingClientRect();
    tooltipEl.style.left = (event.clientX - panelRect.left) + 'px';
    tooltipEl.style.top = (event.clientY - panelRect.top) + 'px';
    tooltipEl.classList.add('show');
  }
  function hideTooltip(){ tooltipEl.classList.remove('show'); }

  function clusterOffsets(n){
    if(n <= 1) return [[0, 0]];
    const r = 4 + Math.min(n, 12) * 0.7;
    const offsets = [];
    for(let i = 0; i < n; i++){
      const angle = (i / n) * Math.PI * 2;
      offsets.push([Math.cos(angle) * r, Math.sin(angle) * r]);
    }
    return offsets;
  }

  function buildGroups(members){
    const groups = {};
    members.forEach(m => {
      if(!m.name || !m.country) return;
      const numeric = numericFor(m.country);
      if(!numeric){ console.warn('No map match for country:', m.country); return; }
      (groups[numeric] = groups[numeric] || []).push(m);
    });
    return groups;
  }

  function renderMap(members, topoData){
    const width = 960, height = 520;
    const svg = d3.select('#worldMap').attr('viewBox', `0 0 ${width} ${height}`);
    svg.selectAll('*').remove();

    const zoomLayer      = svg.append('g').attr('class', 'zoom-layer');
    const countriesLayer = zoomLayer.append('g');
    const dotsLayer      = zoomLayer.append('g');

    const featureCollection = topojson.feature(topoData, topoData.objects.countries);
    const projection = d3.geoNaturalEarth1().fitSize([width, height], featureCollection);
    const path = d3.geoPath(projection);
    const groups = buildGroups(members);

    countriesLayer.selectAll('path')
      .data(featureCollection.features)
      .join('path')
        .attr('class', d => 'country-path' + (groups[d.id] ? ' has-members' : ''))
        .attr('d', path)
        .on('mousemove', (event, d) => {
          const list = groups[d.id] || [];
          const code = list.length ? codeFor(list[0].country) : codeFor(d.properties.name);

          let html = `<div class="tooltip-head">${flagHTML(code, d.properties.name, 'tooltip-flag')}<b>${d.properties.name}</b></div>`;

          if(list.length){
            html += `<div class="tooltip-members">` + list.map(m => `
              <div class="tooltip-member">
                ${avatarHTML(m, 'tooltip-avatar')}
                <span>${m.name}</span>
                <span class="tooltip-member-rank">${rankTag(m)}</span>
              </div>
            `).join('') + `</div>`;
          }

          showTooltip(event, html);
        })
        .on('mouseleave', hideTooltip);

    Object.entries(groups).forEach(([numericId, memberList]) => {
      const feature = featureCollection.features.find(f => f.id === numericId);
      if(!feature) return;
      const centroid = projection(d3.geoCentroid(feature));
      if(!centroid) return;
      const offsets = clusterOffsets(memberList.length);

      dotsLayer.selectAll(`.dot-${numericId}`)
        .data(memberList)
        .join('circle')
          .attr('class', `member-dot dot-${numericId}`)
          .attr('cx', (d, i) => centroid[0] + offsets[i][0])
          .attr('cy', (d, i) => centroid[1] + offsets[i][1])
          .attr('r', 3)
          .on('mousemove', (event, d) => {
            const code = codeFor(d.country);
            const html = `
              <div class="tooltip-head">${avatarHTML(d, 'tooltip-avatar')}<b>${d.name}</b></div>
              <div class="tooltip-member" style="margin-top:0.4em;">
                ${flagHTML(code, d.country, 'tooltip-flag')}
                <span>${d.country}</span>
                <span class="tooltip-member-rank">${rankTag(d)}</span>
              </div>
            `;
            showTooltip(event, html);
          })
          .on('mouseleave', hideTooltip)
          .on('click', (event, d) => highlightMember(d.__id));
    });

    const zoom = d3.zoom()
      .scaleExtent([1, 8])
      .on('zoom', (event) => {
        zoomLayer.attr('transform', event.transform);
        dotsLayer.selectAll('circle').attr('r', 3 / event.transform.k);
      });

    svg.call(zoom);
  }

  /* ---- normalize API rows down to what this page needs ----
     (id, display_name/username, rank, country, avatar — everything
     else the endpoint returns, e.g. cryzen_lvl/discord, is ignored) */
  function normalizeMember(raw){
    return {
      __id: raw.id,
      name: raw.display_name || raw.username || '',
      rank: raw.rank || '',
      country: raw.country || '',
      avatar: raw.avatar || ''
    };
  }

  /* ---- orchestration ---- */
  async function loadAndRender(members){
    renderRows(members);
    try{
      const topoRes = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
      if(!topoRes.ok) throw new Error('map data request failed (' + topoRes.status + ')');
      renderMap(members, await topoRes.json());
    }catch(err){
      console.warn('Could not load world map data:', err);
      document.querySelector('.map-panel').innerHTML = '<div class="rank-status">Could not load map data — check your connection.</div>';
    }
  }

  async function init(){
    try{
      const res = await fetch('/api/members');
      if(!res.ok) throw new Error('/api/members request failed (' + res.status + ')');
      const { members } = await res.json();
      await loadAndRender((members || []).map(normalizeMember));
    }catch(err){
      console.warn('Could not load members from the API:', err);
      statusEl.textContent = 'Could not load members from the API.';
    }
  }

  init();
</script>
</body>
</html>
