<!-- invites.html — invite chat/list, send form, visibility dropdown. Include inside index.html's #invites-mount. -->
<style>
  /* ---------- shared send button (Uiverse by marcelodolza) ---------- */

  .button {
    --primary: #ff5569;
    --neutral-1: #f7f8f7;
    --neutral-2: #e7e7e7;
    --radius: 14px;

    cursor: pointer;
    border-radius: var(--radius);
    color: #16222b;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
    border: none;
    box-shadow: 0 0.5px 0.5px 1px rgba(255, 255, 255, 0.2),
      0 10px 20px rgba(0, 0, 0, 0.2), 0 4px 5px 0px rgba(0, 0, 0, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.3s ease;
    min-width: 200px;
    padding: 20px;
    height: 68px;
    font-family: 'Montserrat', sans-serif;
    font-style: normal;
    font-size: 18px;
    font-weight: 600;
  }
  .button:hover {
    transform: scale(1.02);
    box-shadow: 0 0 1px 2px rgba(255, 255, 255, 0.3),
      0 15px 30px rgba(0, 0, 0, 0.3), 0 10px 3px -3px rgba(0, 0, 0, 0.04);
  }
  .button:active {
    transform: scale(1);
    box-shadow: 0 0 1px 2px rgba(255, 255, 255, 0.3),
      0 10px 3px -3px rgba(0, 0, 0, 0.2);
  }
  .button:after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    border: 2.5px solid transparent;
    background: linear-gradient(var(--neutral-1), var(--neutral-2)) padding-box,
      linear-gradient(to bottom, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.45))
        border-box;
    z-index: 0;
    transition: all 0.4s ease;
  }
  .button:hover::after {
    transform: scale(1.05, 1.1);
    box-shadow: inset 0 -1px 3px 0 rgba(255, 255, 255, 1);
  }
  .button::before {
    content: "";
    inset: 7px 6px 6px 6px;
    position: absolute;
    background: linear-gradient(to top, var(--neutral-1), var(--neutral-2));
    border-radius: 30px;
    filter: blur(0.5px);
    z-index: 2;
  }
  .state p {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .state .icon {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    margin: auto;
    transform: scale(1.25);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .state .icon svg {
    overflow: visible;
  }

  .outline {
    position: absolute;
    border-radius: inherit;
    overflow: hidden;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.4s ease;
    inset: -2px -3.5px;
  }
  .outline::before {
    content: "";
    position: absolute;
    inset: -100%;
    background: conic-gradient(
      from 180deg,
      transparent 60%,
      white 80%,
      transparent 100%
    );
    animation: spin 2s linear infinite;
    animation-play-state: paused;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .button:hover .outline { opacity: 1; }
  .button:hover .outline::before { animation-play-state: running; }

  .state p span {
    display: block;
    opacity: 0;
    animation: slideDown 0.8s ease forwards calc(var(--i) * 0.03s);
  }
  .button:hover p span {
    opacity: 1;
    animation: wave 0.5s ease forwards calc(var(--i) * 0.02s);
  }
  .button:focus p span {
    opacity: 1;
    animation: disapear 0.6s ease forwards calc(var(--i) * 0.03s);
  }
  @keyframes wave {
    30% { opacity: 1; transform: translateY(4px) translateX(0) rotate(0); }
    50% { opacity: 1; transform: translateY(-3px) translateX(0) rotate(0); color: var(--primary); }
    100% { opacity: 1; transform: translateY(0) translateX(0) rotate(0); }
  }
  @keyframes slideDown {
    0% { opacity: 0; transform: translateY(-20px) translateX(5px) rotate(-90deg); color: var(--primary); filter: blur(5px); }
    30% { opacity: 1; transform: translateY(4px) translateX(0) rotate(0); filter: blur(0); }
    50% { opacity: 1; transform: translateY(-3px) translateX(0) rotate(0); }
    100% { opacity: 1; transform: translateY(0) translateX(0) rotate(0); }
  }
  @keyframes disapear {
    from { opacity: 1; }
    to { opacity: 0; transform: translateX(5px) translateY(20px); color: var(--primary); filter: blur(5px); }
  }

  .state--default .icon svg { animation: land 0.6s ease forwards; }
  .button:hover .state--default .icon { transform: rotate(45deg) scale(1.25); }
  .button:focus .state--default svg { animation: takeOff 0.8s linear forwards; }
  .button:focus .state--default .icon { transform: rotate(0) scale(1.25); }
  @keyframes takeOff {
    0% { opacity: 1; }
    60% { opacity: 1; transform: translateX(70px) rotate(45deg) scale(2); }
    100% { opacity: 0; transform: translateX(160px) rotate(45deg) scale(0); }
  }
  @keyframes land {
    0% { transform: translateX(-60px) translateY(30px) rotate(-50deg) scale(2); opacity: 0; filter: blur(3px); }
    100% { transform: translateX(0) translateY(0) rotate(0); opacity: 1; filter: blur(0); }
  }

  .state--default .icon:before {
    content: "";
    position: absolute;
    top: 50%;
    height: 2px;
    width: 0;
    left: -5px;
    background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.5));
  }
  .button:focus .state--default .icon:before {
    animation: contrail 0.8s linear forwards;
  }
  @keyframes contrail {
    0% { width: 0; opacity: 1; }
    8% { width: 15px; }
    60% { opacity: 0.7; width: 80px; }
    100% { opacity: 0; width: 160px; }
  }

  .state {
    padding-left: 29px;
    z-index: 2;
    display: flex;
    position: relative;
  }
  .state--default span:nth-child(4) { margin-right: 5px; }
  .state--sent { display: none; }
  .state--sent svg { transform: scale(1.25); margin-right: 8px; }
  /* the sent-panel shows "Sent" by default once visible; while a request is
     actually in flight (button has .is-sending, added/removed by JS based on
     the real fetch result) it shows "Sending…" instead */
  .state--sent .label-sending{ display: none; }
  .button.is-sending .state--sent .label-sent{ display: none; }
  .button.is-sending .state--sent .label-sending{ display: flex; }
  .button:focus .state--default { position: absolute; }
  .button:focus .state--sent { display: flex; }
  .button:focus .state--sent span {
    opacity: 0;
    animation: slideDown 0.8s ease forwards calc(var(--i) * 0.2s);
  }
  .button:focus .state--sent .icon svg {
    opacity: 0;
    animation: appear 1.2s ease forwards 0.8s;
  }
  @keyframes appear {
    0% { opacity: 0; transform: scale(4) rotate(-40deg); color: var(--primary); filter: blur(4px); }
    30% { opacity: 1; transform: scale(0.6); filter: blur(1px); }
    50% { opacity: 1; transform: scale(1.2); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ---------- invites section ---------- */

  .invites-section{
    position:relative;
    z-index:2;
    max-width:640px;
    margin:0 auto;
    padding:1vh 1.5em 9vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.7em;
  }

  .invite-chat{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:0.6em;
  }

  /* sent invites — newest at the bottom, scrolls once it grows past ~5 rows.
     Height is fixed (not max-height) so the panel holds its full size even
     empty or with only a couple of invites — no layout jump as it fills up. */
  .invites-list{
    position:relative;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:0.5em;
    height:270px;
    overflow-y:auto;
    padding-right:4px;
  }
  .invites-list::-webkit-scrollbar{ width:6px; }
  .invites-list::-webkit-scrollbar-track{ background:transparent; }
  .invites-list::-webkit-scrollbar-thumb{ background:rgba(111,195,232,0.35); border-radius:3px; }

  .invites-empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.72em;
    font-weight:700;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    opacity:0.5;
    pointer-events:none;
  }

  .invite-item{
    align-self:flex-end;
    max-width:88%;
    display:flex;
    align-items:center;
    gap:0.5em;
    padding:0.55em 0.85em;
    background:linear-gradient(135deg, rgba(111,195,232,0.16), rgba(111,195,232,0.06));
    border:1px solid rgba(111,195,232,0.35);
    clip-path:polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    font-size:0.78em;
    color:var(--ice-bright);
  }
  .invite-item-icon{
    flex-shrink:0;
    color:var(--ice-bright);
  }
  .invite-item-sender{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:0.4em;
  }
  .invite-item-sender b{
    font-weight:800;
    color:var(--ice-bright);
    white-space:nowrap;
  }
  .invite-item-sender-tag{
    padding:0.15em 0.45em;
    border:1px solid rgba(111,195,232,0.35);
    font-size:0.6em;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text-dim);
    white-space:nowrap;
  }
  .invite-item a{
    color:inherit;
    text-decoration:none;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .invite-item a:hover{
    text-decoration:underline;
  }

  /* input row — thin, single line, link-only */
  .invite-panel{
    width:100%;
    display:flex;
    flex-direction:row;
    align-items:stretch;
    gap:0.7em;
  }

  .geo-box{
    flex:1;
    min-width:0;
    padding:2px;
    clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    background:linear-gradient(135deg, var(--ice), rgba(111,195,232,0.15));
  }

  .invite-input{
    display:block;
    width:100%;
    height:100%;
    min-height:46px;
    border:none;
    outline:none;
    clip-path:polygon(11px 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%, 0 11px);
    background:var(--panel);
    color:var(--text);
    font-family:'Montserrat',sans-serif;
    font-size:0.85em;
    padding:0 1.1em;
  }
  .invite-input::placeholder{
    color:var(--text-dim);
  }
  .invite-input:focus{
    background:#0e1a22;
  }

  /* ---------- visibility dropdown ---------- */

  .vis-select{
    position:relative;
    flex-shrink:0;
    display:flex;
  }

  .vis-trigger{
    display:flex;
    align-items:center;
    gap:0.55em;
    padding:0 0.9em;
    background:var(--panel);
    border:1px solid var(--outline);
    color:var(--text);
    font-family:'Montserrat',sans-serif;
    font-size:0.78em;
    font-weight:600;
    letter-spacing:0.02em;
    white-space:nowrap;
    cursor:pointer;
    clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition:border-color .2s ease, color .2s ease;
  }
  .vis-trigger:hover,
  .vis-select.open .vis-trigger{
    border-color:var(--ice);
    color:var(--ice-bright);
  }
  .vis-trigger svg{
    width:11px;
    height:11px;
    flex-shrink:0;
    transition:transform .2s ease;
  }
  .vis-select.open .vis-trigger svg{
    transform:rotate(180deg);
  }

  .vis-dropdown{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    min-width:190px;
    background-color:var(--panel);
    outline:1px solid var(--outline);
    border:1px solid #000;
    box-shadow:0 12px 28px rgba(0,0,0,0.45);
    z-index:20;
    opacity:0;
    visibility:hidden;
    transform:translateY(6px);
    transition:opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
  }
  .vis-select.open .vis-dropdown{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
    transition:opacity .18s ease, transform .18s ease, visibility 0s linear 0s;
  }

  .vis-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:0.6em;
    padding:0.7em 0.9em;
    font-size:0.78em;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
    border-bottom:1px solid rgba(111,195,232,0.1);
    transition:background-color .15s ease, color .15s ease;
  }
  .vis-option:last-child{ border-bottom:none; }
  .vis-option:hover{
    background:rgba(111,195,232,0.08);
    color:var(--ice-bright);
  }
  .vis-option.active{
    color:var(--ice-bright);
  }
  .vis-option .vis-default-tag{
    font-size:0.85em;
    color:var(--text-dim);
    font-weight:500;
  }

  /* narrow screens: input drops to its own row, dropdown + send share the next */
  @media (max-width:560px){
    .invite-panel{
      flex-wrap:wrap;
    }
    .geo-box{
      flex:1 1 100%;
    }
    .vis-select{
      flex:1 1 auto;
    }
    .vis-trigger{
      width:100%;
      justify-content:space-between;
    }
    .button.send-btn{
      flex:1 1 auto;
      min-width:0;
    }
  }

  /* shared send button, scaled down + recolored to the icy palette */
  .button.send-btn{
    --primary: var(--ice-bright);
    min-width:130px;
    height:48px;
    padding:0 20px;
    font-size:14px;
    border-radius:11px;
  }
  .button.send-btn .state{
    padding-left:22px;
  }

  /* no spinning border sweep on hover */
  .button.send-btn:hover .outline{
    opacity:0;
  }

  /* once the initial letter reveal has played, hovering off shouldn't replay it —
     idle state (not hovered, not focused) just holds the resting look statically */
  .button.send-btn.letters-settled:not(:hover):not(:focus) .state p span{
    animation:none;
    opacity:1;
    transform:none;
  }

  .invite-message{
    width:100%;
    min-height:1.1em;
    font-size:0.72em;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--text-dim);
    text-align:center;
  }
  .invite-message.error{ color:#ff8a8a; }
  .invite-message.success{ color:var(--ice-bright); }
</style>

<script>
  // ================= invites DOM refs =================
  const invitesList = document.getElementById('invitesList');
  const inviteInput = document.getElementById('inviteInput');
  const sendBtn = document.getElementById('sendInviteBtn');
  const inviteMessage = document.getElementById('inviteMessage');

  const visSelect = document.getElementById('visSelect');
  const visTrigger = document.getElementById('visTrigger');
  const visLabel = document.getElementById('visLabel');
  const visDropdown = document.getElementById('visDropdown');
  const visOptions = Array.from(visDropdown.querySelectorAll('.vis-option'));

  let visibilityMode = 'public'; // 'public' | 'members'

  // ================= invites =================

  /*
   * Load visible invites.
   */
async function loadInvites(){
    const hasExistingInvites = invitesList.querySelector('.invite-item') !== null;

    if(!hasExistingInvites){
        invitesList.innerHTML =
            '<div class="invites-empty">Loading…</div>';
    }

    try{
        const response = await fetch('/api/invites', {
            method: 'GET',
            credentials: 'include'
        });

        if(!response.ok){
            if(!hasExistingInvites){
                invitesList.innerHTML =
                    '<div class="invites-empty">Could not load invites.</div>';
            }
            return;
        }

        const data = await response.json();

        renderInvites(data.invites || []);

    }catch(error){
        console.error(error);

        if(!hasExistingInvites){
            invitesList.innerHTML =
                '<div class="invites-empty">Could not connect to the server.</div>';
        }
    }
}

  /*
   * Render invites, newest at the bottom.
   */
  function renderInvites(invites){
    invitesList.innerHTML = '';

    if(invites.length === 0){
      invitesList.innerHTML = '<div class="invites-empty">No invites sent yet</div>';
      return;
    }

    // API returns newest first; reverse for chat-style rendering.
    const chronological = [...invites].reverse();

    for(const invite of chronological){
      const item = document.createElement('div');
      item.className = 'invite-item';

      if(invite.display_name){
        const sender = document.createElement('span');
        sender.className = 'invite-item-sender';

        const nameEl = document.createElement('b');
        nameEl.textContent = invite.display_name;
        sender.appendChild(nameEl);

        const tagEl = document.createElement('span');
        tagEl.className = 'invite-item-sender-tag';
        tagEl.textContent = rankLabel(invite.rank);
        sender.appendChild(tagEl);

        item.appendChild(sender);
      }

      const icon = document.createElementNS('http://www.w3.org/2000/svg','svg');
      icon.setAttribute('class','invite-item-icon');
      icon.setAttribute('viewBox','0 0 24 24');
      icon.setAttribute('width','14');
      icon.setAttribute('height','14');
      icon.innerHTML = '<path d="M9 6.5L15 12l-6 5.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';

      const a = document.createElement('a');
      a.href = invite.join_url || invite.invite_value;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = invite.invite_value;
      a.textContent = invite.invite_value;

      item.appendChild(icon);
      item.appendChild(a);
      invitesList.appendChild(item);
    }

    // Keep the newest invite visible at the bottom.
    invitesList.scrollTop = invitesList.scrollHeight;
  }

  function setInviteMessage(text, kind){
    inviteMessage.textContent = text || '';
    inviteMessage.classList.remove('error', 'success');
    if(kind) inviteMessage.classList.add(kind);
  }

  /*
   * Send invite.
   */
async function handleSend(){

    if(!currentMember){
        setInviteMessage(
            'Log in to send an invite.',
            'error'
        );

        sendBtn.blur();
        openLoginModal();
        return;
    }

    const value = inviteInput.value.trim();

    if(!value){
        setInviteMessage(
            'Enter an invite first.',
            'error'
        );

        sendBtn.blur();
        return;
    }

    const accessType =
        visibilityMode === 'members'
            ? 'members_only'
            : 'public';


    setInviteMessage('Sending…');
    sendBtn.classList.add('is-sending');


    try{

        const response = await fetch('/api/invites', {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            credentials: 'include',

            body: JSON.stringify({
                invite_value: value,
                access_type: accessType
            })
        });


        const data = await response.json();


        if(!response.ok){

            setInviteMessage(
                data.error || 'Could not send invite.',
                'error'
            );

            sendBtn.classList.remove('is-sending');
            sendBtn.blur();
            return;
        }


        inviteInput.value = '';

        resetVisibility();

        setInviteMessage(
            'Invite sent.',
            'success'
        );

        sendBtn.classList.remove('is-sending');

        await loadInvites();

    }catch(error){

        console.error(error);

        setInviteMessage(
            'Could not connect to the server.',
            'error'
        );

        sendBtn.classList.remove('is-sending');
        sendBtn.blur();
    }
}

  sendBtn.addEventListener('click', handleSend);
  inviteInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      e.preventDefault();
      sendBtn.focus();
      handleSend();
    }
  });

  // ================= visibility dropdown (Public / Members Only) =================
  function setVisOptionActive(value){
    visOptions.forEach(o => o.classList.toggle('active', o.getAttribute('data-value') === value));
  }

function setVisLabel(){

    if(visibilityMode === 'members'){
        visLabel.textContent = 'Members Only';
        return;
    }

    visLabel.textContent = 'Public';
}

function resetVisibility(){
    visibilityMode = 'public';

    setVisOptionActive('public');
    setVisLabel();
}

  function openVisDropdown(){ visSelect.classList.add('open'); }
  function closeVisDropdown(){ visSelect.classList.remove('open'); }

  visTrigger.addEventListener('click', e => {
    e.stopPropagation();
    visSelect.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if(!visSelect.contains(e.target)) closeVisDropdown();
  });

  visOptions.forEach(opt => {
    opt.addEventListener('click', () => {
      visibilityMode = opt.getAttribute('data-value');
      setVisOptionActive(visibilityMode);
      setVisLabel();
      closeVisDropdown();
    });
  });

  // after the initial letter reveal has played once, stop treating hover-out as a re-trigger
  setTimeout(() => sendBtn.classList.add('letters-settled'), 950);
</script>
